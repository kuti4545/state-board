name: State Board

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: state-board
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tara
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOARD_PASSWORD: ${{ secrets.BOARD_PASSWORD }}
          MIN_POPCOUNT: "6"
          MIN_COMBO: "0.72"
        run: python scan.py
      - name: Kaydet
        run: |
          git config user.name "state-board"
          git config user.email "state-board@users.noreply.github.com"
          mkdir -p docs
          git add docs/index.html docs/board.json docs/board_state.json
          if git diff --cached --quiet; then echo yok; else git commit -m "board" && git push; fi
